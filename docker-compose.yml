services:
  db:
    image: postgis/postgis:16-3.4
    container_name: wattwhere-db
    environment:
      POSTGRES_USER: wattwhere
      POSTGRES_PASSWORD: wattwhere
      POSTGRES_DB: wattwhere
    ports:
      - "5433:5432"
    volumes:
      - wattwhere_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattwhere -d wattwhere"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wattwhere_pgdata:
