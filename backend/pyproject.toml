[project]
name = "wattwhere-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "django>=5.2,<5.3",
    "geopandas>=1.2.0",
    "mcp>=2.3.0",
    "open-mastr>=1.1.0",
    "psycopg[binary]>=3",
    "pyogrio>=0.13.0",
    "pyyaml>=6.0.4",
    "sqlglot>=30.33.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]
